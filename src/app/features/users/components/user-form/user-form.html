<div class="form-container">
  <div class="brand-header">
    <div class="brand-logo" aria-hidden="true">
      <span class="circle circle-red"></span>
      <span class="circle circle-orange"></span>
    </div>
    <h2>{{ title() }}</h2>
    <p class="brand-subtitle">Registro de usuarios</p>
  </div>

  <div class="form-group">
    <label>Nombre *</label>
    <input
      type="text"
      [value]="formData().name"
      (input)="updateName($any($event.target).value)"
      placeholder="Nombre completo"
      autofocus>
  </div>

  <div class="form-group">
    <label>Email *</label>
    <input
      type="email"
      [value]="formData().email"
      (input)="updateEmail($any($event.target).value)"
      placeholder="usuario@ejemplo.com">
  </div>

  <div class="form-group">
    <label>Rol</label>
    <div class="select-wrapper">
      <select [value]="formData().role" (change)="updateRole($any($event.target).value)">
        <option value="viewer">Viewer</option>
        <option value="editor">Editor</option>
        <option value="admin">Admin</option>
      </select>
    </div>
  </div>

  <button type="button" class="btn-submit" (click)="onSubmit()">Guardar</button>

  <div class="form-footer">
    <button type="button" class="btn-link" (click)="onCancel()">Cancelar</button>
  </div>
</div>
