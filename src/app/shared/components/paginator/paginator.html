<div class="paginator">
  <div class="paginator-info">
    Mostrando <strong>{{ startItem() }} - {{ endItem() }}</strong> de {{ total() }} usuarios
  </div>

  <div class="paginator-controls">
    <button
      class="nav-btn"
      (click)="previous()"
      [disabled]="page() === 1"
      aria-label="Página anterior"
    >
      ‹
    </button>

    @for (p of visiblePages(); track $index) {
      @if (p === null) {
        <span class="ellipsis">…</span>
      } @else {
        <button
          class="page-btn"
          [class.active]="p === page()"
          (click)="goToPage(p)"
          [attr.aria-current]="p === page() ? 'page' : null"
        >
          {{ p }}
        </button>
      }
    }

    <button
      class="nav-btn"
      (click)="next()"
      [disabled]="page() === pages()"
      aria-label="Página siguiente"
    >
      ›
    </button>
  </div>

  <div class="paginator-limit">
    <label for="limit">Por página</label>
    <select
      id="limit"
      [ngModel]="limit()"
      (ngModelChange)="changeLimit($event)"
    >
      @for (option of limitOptions; track option) {
        <option [value]="option">{{ option }}</option>
      }
    </select>
  </div>
</div>
